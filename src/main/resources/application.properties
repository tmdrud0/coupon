spring.application.name=coupon
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/coupon?serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:coupon}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:coupon}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.repositories.enabled=false

coupon.redis.reservation-ttl=${COUPON_REDIS_RESERVATION_TTL:PT24H}

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${COUPON_KAFKA_CONSUMER_GROUP:coupon-issuer}
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.listener.ack-mode=record

coupon.kafka.issue-topic=${COUPON_KAFKA_ISSUE_TOPIC:coupon-issue-requests}
coupon.kafka.publish-timeout=${COUPON_KAFKA_PUBLISH_TIMEOUT:PT5S}
coupon.outbox.publisher.batch-size=${COUPON_OUTBOX_BATCH_SIZE:50}
coupon.outbox.publisher.fixed-delay=${COUPON_OUTBOX_FIXED_DELAY:1000}
coupon.outbox.publisher.initial-delay=${COUPON_OUTBOX_INITIAL_DELAY:1000}
coupon.outbox.publisher.claim-timeout=${COUPON_OUTBOX_CLAIM_TIMEOUT:PT30S}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
